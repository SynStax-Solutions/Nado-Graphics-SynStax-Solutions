name: React CI - Build & Test

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: react-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'   # needs package-lock.json in the repo root

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests (Vitest)
        run: npx vitest run --passWithNoTests

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          if-no-files-found: ignore
